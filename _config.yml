# ══════════════════════════════════════════════════════════════════════════════
# CE QUE GITHUB PAGES NE DOIT PAS SERVIR
#
# GitHub Pages construit ce dépôt avec Jekyll (il n'y a pas de `.nojekyll`), et
# `exclude` est la seule chose que Jekyll lit ici : aucun fichier du site ne
# porte d'en-tête YAML ni de syntaxe Liquid, ils sont donc recopiés tels quels.
#
# POURQUOI CE FICHIER EXISTE. Jusqu'au 2026-08-25, Pages servait la RACINE : tout
# ce qui est versionné était servi. Mesuré ce jour-là sur
# https://q-leap.github.io/qbot-website/ : CLAUDE.md répondait 200 (223 Ko de
# notes internes, dont le tarif et les sept références clients)
# (le gestionnaire de blog, mot de passe en clair), et Documentations/ servait
# les PDF d'audit, la brochure et la charte. robots.txt ne protégeait rien de
# tout cela : il demande poliment aux moteurs de ne pas regarder, il ne ferme
# aucune porte, et un fichier .md ne peut pas porter de balise « noindex ».
#
# CE FICHIER EST LE SEUL MÉCANISME, ET IL FAUT LE SAVOIR. Un workflow GitHub
# Actions a existé quelques heures le 2026-08-25, avec la même liste plus un
# contrôle qui faisait ÉCHOUER la publication si un fichier de travail s'y
# glissait. Il a été retiré sur décision du client : tant que la source Pages
# reste « Deploy from a branch », les deux déployaient à chaque push sur la même
# cible et le dernier arrivé gagnait, ce qui est une course, pas une sécurité.
# Relevé sur un même commit : construction depuis la branche à 12:30:03,
# workflow à 12:29:45. C'était donc toujours ce fichier-ci qui servait.
#
# CONSÉQUENCE : L'EXCLUSION EST SILENCIEUSE. Un dossier de travail ajouté plus
# tard et oublié dans la liste ci-dessous part en ligne sans un mot, et rien ne
# le signale. À chaque ajout d'un dossier qui n'est pas du site, l'inscrire ici.
# Le contrôle est une commande, à passer avant la mise en ligne :
#   for u in CLAUDE.md Documentations/website/ tools/ padel_alerte.py; do \
#     curl -s -o /dev/null -w "%{http_code} $u\n" "https://q-bot.eu/$u"; done
# doit répondre 404 sur chaque ligne. LE 2026-08-26, CE CONTRÔLE N'AVAIT JAMAIS ÉTÉ
# PASSÉ DEPUIS L'ARRIVÉE DE padel_alerte.py, et l'audit RosoAI l'a trouvé servi : la
# consigne écrite juste au-dessus ne protège rien tant que personne ne l'exécute.
#
# CE QUI N'EST PAS RÉGLÉ ICI : le dépôt est PUBLIC, donc ces fichiers restent
# lisibles sur github.com et dans l'historique git. Seul un passage en dépôt
# privé le règle, et Pages sur dépôt privé demande un plan Pro / Team /
# Enterprise. Décision séparée.
# ══════════════════════════════════════════════════════════════════════════════

exclude:
  # Dessin industriel du produit (OBJ 30,8 Mio + FBX 5,2 Mio) : servi en 200
  # jusqu'au 2026-08-31, alors qu'aucune page ne le lie. Seul
  # « assets/models/qbot.glb » est employé. Relevé par l'audit RosoAI n°5.
  - assets/3d/
  - CLAUDE.md               # consignes de développement : tarif, références clients, arbitrages
  - claude.md.txt           # une version plus ancienne des mêmes consignes
  - Documentations/         # PDF d'audit, brochure, charte, masters IA archivés, maquettes HTML
  - tools/                  # chaîne de rendu, scripts de génération, 2 pages HTML de travail
  - website 3/              # SECONDE copie des quatre pages de maquette anglaises
  - Screen modèle 3D/       # rendus CAO et enregistrement d'écran
  - padel_alerte.py         # script personnel, sans rapport avec le site (aussi sorti du suivi git)
  - .gitignore

  # ── Actifs que plus aucune page ne référence (relevé de l'audit RosoAI n°6,
  #    2026-08-31 : 33 fichiers, 4,89 Mo servis pour rien). Ils restent sur le
  #    disque et dans git, conformément à l'usage du dépôt, mais l'hébergement
  #    cesse de les proposer. LE CONTRÔLE QUI LES TROUVE EST UNE ÉNUMÉRATION,
  #    PAS UNE VÉRIFICATION : on liste tout ce que Pages répond en 200 et on
  #    vérifie que chaque fichier y a sa place, plutôt que de vérifier que les
  #    exclusions répondent 404. C'est cette inversion qui avait trouvé la CAO.
  #    Avant d'ajouter une ligne ici : s'assurer qu'aucune page, feuille de
  #    style ni script servi ne cite le nom du fichier. L'erreur inverse (exclure
  #    un actif employé) casse la page en silence, exactement comme l'oubli.
  - assets/img/guides/      # 12 vignettes des 8 guides supprimés le 2026-08-28
  - assets/img/blog/        # 5 vignettes du blog supprimé le 2026-08-28
  # Visuels des générations précédentes du produit, remplacés par les photos de
  # la brochure (2026-08-24) et par les rendus du GLB.
  - assets/img/device-comparison.png
  - assets/img/device-3d.png
  - assets/img/hero-device.png
  - assets/img/interface-screenshot.png
  - assets/img/qbot-proto-gen1.png
  # Les deux visuels de la section « évolution », retirée des accueils le
  # 2026-09-02 : plus aucune page ne les cite.
  - assets/img/qbot-proto-1-boitier.webp
  - assets/img/qbot-nfc.webp
  # La boucle décorative de 8,7 s et son affiche : le film de démonstration a
  # pris sa place dans les deux accueils le 2026-09-02.
  - assets/video/qbot-home.mp4
  - assets/img/qbot-film-poster.jpg
  - assets/img/qbot-v3-exploded.png
  - assets/img/qbot-v3-hero.png
  - assets/img/qbot-v3-luxtrust.png
  - assets/img/qbot-v3-render.png
  - assets/img/qbot-v3-solution.png
  # Logos et icônes sans emploi. « logo-baseline.png » EN FAIT PARTIE DEPUIS LE
  # 2026-09-02 : la note d'à côté disait que le JSON-LD « Organization.logo » le
  # citait encore, ce qui n'est plus vrai depuis le changement de logo du
  # 2026-08-28 (il pointe sur logo-qbot.png sur les 21 pages). Trouvé par le
  # contrôle « aucun actif servi sans référence », qui est le seul à voir ce
  # genre de reste : une note qui dit « attention, celui-là sert » se revérifie
  # avant d'être citée.
  - assets/img/logo-baseline.png
  - assets/img/logo.png
  - assets/img/logo-footer.png
  - assets/img/logo-baseline-neg.png
  - assets/img/logo-qdigital.png
  - assets/img/group-icon.png
  - assets/img/favicon-16.png
  # Le visuel de synthèse de « La solution », fourni par le client le 2026-09-01 et
  # remplacé le 2026-09-02 par une image du film produit. Motif : son écran de
  # téléphone montrait une validation LuxTrust INVENTÉE citant MyGuichet, seul point
  # ouvert du contrôle n°8 de l'audit. Gardé dans git, plus servi.
  - assets/img/qbot-2fa-dock.jpg
  # L'image extraite du film qui a tenu la section « La solution » une demi-journée,
  # le 2026-09-02 : la photo fournie par le client l'a remplacée le soir même.
  - assets/img/qbot-film-dock.jpg
  # Le schéma du flux 2FA, construit le 2026-09-01 pour la section « La solution »
  # puis remplacé le même jour par le visuel fourni par le client. Gardé dans git
  # (il se remet en place en changeant un `src`), mais plus servi : la règle du
  # jour est qu'aucun actif servi n'est sans référence.
  - assets/img/qbot-2fa-flux.jpg
  - assets/img/qbot-2fa-flux-en.jpg
